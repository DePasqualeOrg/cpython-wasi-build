name: "Create release"
run-name: "Release Python ${{ inputs.python_major_minor }}.${{ inputs.python_micro }}"

env:
  TARGET_TRIPLE: "wasm32-wasip1"

on:
    workflow_dispatch:
        inputs:
            python_major_minor:
                required: true
                default: "3.15"
                description: "Major.minor version of CPython to build"
            python_micro:
                required: true
                description: "Micro version + release level of CPython to build"

permissions: {}

jobs:
    get-wasi-sdk-version:
      name: "Get WASI SDK version"
      runs-on: ubuntu-slim
      outputs:
        wasi_sdk_version: ${{ steps.get-version.outputs.wasi_sdk_version }}
      steps:
        - name: "Checkout the CPython v${{ inputs.python_major_minor }}.${{ inputs.python_micro }} branch"
          uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
          with:
            repository: "python/cpython"
            ref: "v${{ inputs.python_major_minor }}.${{ inputs.python_micro }}"
            persist-credentials: false
        - name: "Install Python"
          uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
          with:
            python-version: "3.x"
        - name: "Get WASI SDK version"
          id: get-version
          shell: python
          run: |
            import os
            from pathlib import Path
            config_path = Path("Platforms/WASI/config.toml")
            if config_path.exists():
                import tomllib
                config = tomllib.loads(config_path.read_text())
                version = config["targets"]["wasi-sdk"]
            else:
                # CPython 3.14 and earlier don't have config.toml
                version = "24"
            with open(os.environ["GITHUB_OUTPUT"], "a") as f:
                f.write(f"wasi_sdk_version={version}\n")

    build:
      needs: get-wasi-sdk-version
      name: "Build CPython using the WASI SDK"
      runs-on: ubuntu-latest
      env:
        ZIP_DIR: "zip-file"
      steps:
        - name: "Install build dependencies"
          # https://devguide.python.org/getting-started/setup-building/#linux
          # Removed: gdb lcov libncurses5-dev libreadline6-dev tk-dev
          run: |
            sudo apt-get update
            sudo apt-get install build-essential pkg-config \
            curl openssl unzip zip \
            libbz2-dev libffi-dev libgdbm-dev libgdbm-compat-dev \
            liblzma-dev libsqlite3-dev libssl-dev \
            lzma lzma-dev uuid-dev zlib1g-dev
        - name: "Install Python"
          uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
          with:
            python-version: "3.x"
        - name: "Checkout the CPython v${{ inputs.python_major_minor }}.${{ inputs.python_micro }} branch"
          uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
          with:
            repository: "python/cpython"
            ref: "v${{ inputs.python_major_minor }}.${{ inputs.python_micro }}"
            persist-credentials: false
        - name: "Checkout the WASI build configuration"
          uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
          with:
            path: .build-config
            persist-credentials: false
        - name: "Apply App Store compliance patch"
          # Apple's automated App Review rejects any app whose bundle contains
          # the string "itms-services", which ships in the unpatched stdlib's
          # urllib/parse.py (python/cpython#120522). CPython carries the fix
          # in-tree as the patch that `--with-app-store-compliance` applies on
          # macOS/iOS builds; the WASI build doesn't honor that flag, so apply
          # it directly.
          run: patch -p1 < Mac/Resources/app-store-compliance.patch
        - name: "Install WASI SDK ${{ needs.get-wasi-sdk-version.outputs.wasi_sdk_version }}"
          id: install-wasi-sdk
          uses: bytecodealliance/setup-wasi-sdk-action@b2de090b44eb70013ee96b393727d473b35e1728 # main at 2026-02-25
          with:
            version: ${{ needs.get-wasi-sdk-version.outputs.wasi_sdk_version }}
            add-to-path: false
        - name: "Install wasmtime"
          uses: bytecodealliance/actions/wasmtime/setup@6aecabac1eb1dcf7ed94ba9471974415ee2ebef2 # v1.1.2
        - name: "Build WASI compression and SQLite dependencies"
          run: .build-config/scripts/build-wasi-dependencies.sh
          env:
            WASI_SDK_PATH: ${{ steps.install-wasi-sdk.outputs.wasi-sdk-path }}
        - name: "Build"
          run: |
            if [[ -d Platforms/WASI ]]; then
              wasi_builder=(python3 Platforms/WASI)
            else
              wasi_builder=(python3 Tools/wasm/wasi)
            fi
            "${wasi_builder[@]}" build-python
            set -a
            source .wasi-deps/dependency.env
            set +a
            "${wasi_builder[@]}" build-host
          env:
            WASI_SDK_PATH: ${{ steps.install-wasi-sdk.outputs.wasi-sdk-path }}
        - name: "Create lib directory"
          shell: bash
          run: |
            set -e
            export PYTHON_BIN_NAME=$(cross-build/*-linux-*/python -c "import sys; print(f'python{sys.version_info.major}.{sys.version_info.minor}')")
            export ZIP_LIB_DIR=${{ env.ZIP_DIR }}/lib/$PYTHON_BIN_NAME
            mkdir --parents $ZIP_LIB_DIR
            echo "ZIP_LIB_DIR=$ZIP_LIB_DIR" >> $GITHUB_ENV
        - name: "Copy python.wasm"
          run: cp  cross-build/${{ env.TARGET_TRIPLE }}/python.wasm ${{ env.ZIP_DIR }}
        - name: "Copy stdlib"
          # Adding lib-dynload to silence the error message:
          # "Could not find platform dependent libraries <exec_prefix>".
          run: |
            cp -r Lib/* ${ZIP_LIB_DIR}
            mkdir ${ZIP_LIB_DIR}/lib-dynload
        - name: "Install verified universal wheels"
          run: .build-config/scripts/install-python-packages.sh
          env:
            SITE_PACKAGES: ${{ env.ZIP_LIB_DIR }}/site-packages
        - name: "Strip stdlib"
          # Based on preexisting practice; could probably strip out more.
          run: |
            pushd ${ZIP_LIB_DIR}
            rm -rf curses/ ctypes/test/ ensurepip/ distutils/ \
              lib2to3/ idlelib/ test/ multiprocessing/ \
              tkinter/ turtledemo/ venv/ unittest/test/
            find . -name __pycache__ -type d -prune -exec rm -rf {} +
            popd
        - name: "Copy over _sysconfigdata_*.py"
          run: cp cross-build/${{ env.TARGET_TRIPLE }}/build/lib.*/_sysconfigdata_*.py ${ZIP_LIB_DIR}
        - name: "Copy LICENSE"
          run: |
            cp LICENSE ${{ env.ZIP_DIR }}/
            cp .build-config/DEPENDENCIES.md ${{ env.ZIP_DIR }}/THIRD_PARTY_DEPENDENCIES.md
            cp -r .wasi-deps/licenses ${{ env.ZIP_DIR }}/third-party-licenses
        - name: "Verify App Store compliance"
          # Belt and suspenders for the patch step above: fail the build if the
          # prohibited string survives anywhere in the release contents
          # (python.wasm or the stdlib), e.g. after a CPython upgrade moves it.
          run: |
            if grep --recursive --fixed-strings "itms-services" ${{ env.ZIP_DIR }}; then
              echo "Found prohibited string 'itms-services' in release contents" >&2
              exit 1
            fi
        - name: "Create executable zip"
          run: |
            pushd ${{ env.ZIP_DIR }}
            zip -r python.zip *
            popd
            du -h ${{ env.ZIP_DIR }}/python.wasm ${{ env.ZIP_DIR }}/python.zip
        - name: "Create build artifact zip"
          run: |
            cp LICENSE cross-build/${{ env.TARGET_TRIPLE }}/
            cp .build-config/DEPENDENCIES.md cross-build/${{ env.TARGET_TRIPLE }}/THIRD_PARTY_DEPENDENCIES.md
            mkdir cross-build/${{ env.TARGET_TRIPLE }}/wasi-dependencies
            cp .wasi-deps/lib/*.a cross-build/${{ env.TARGET_TRIPLE }}/wasi-dependencies/
            pushd cross-build/${{ env.TARGET_TRIPLE }}
            zip build.zip \
              LICENSE \
              THIRD_PARTY_DEPENDENCIES.md \
              config.log config.cache Makefile pyconfig.h libpython*.a \
              Modules/Setup.local Modules/Setup.stdlib Modules/config.c \
              Modules/_decimal/libmpdec/libmpdec.a \
              Modules/_hacl/*.a \
              Modules/expat/libexpat.a \
              Programs/python.o \
              wasi-dependencies/*.a
            popd
        - name: "Upload executable zip"
          uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
          with:
            name: python
            path: ${{ env.ZIP_DIR }}/python.zip
            retention-days: 1
        - name: "Upload build artifact zip"
          uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
          with:
            name: build
            path: cross-build/${{ env.TARGET_TRIPLE }}/build.zip
            retention-days: 1

    test:
      needs: build
      name: "Test the build"
      runs-on: ubuntu-slim
      steps:
        - name: "Install wasmtime"
          uses: bytecodealliance/actions/wasmtime/setup@6aecabac1eb1dcf7ed94ba9471974415ee2ebef2 # v1.1.2
        - name: "Download executable zip"
          uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
          with:
            name: python
        - name: "Extract executable zip"
          run: unzip python.zip
        - name: "Test"
          run: |
            wasmtime --dir .::/ --env PYTHONHOME=/ python.wasm -m sysconfig
            wasmtime --dir .::/ --env PYTHONHOME=/ python.wasm -c '
            import bz2, gzip, io, lzma, zipfile, zlib
            payload = b"WASI compression round trip" * 32
            assert zlib.decompress(zlib.compress(payload)) == payload
            assert bz2.decompress(bz2.compress(payload)) == payload
            assert lzma.decompress(lzma.compress(payload)) == payload
            archive = io.BytesIO()
            with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED) as output:
                output.writestr("payload.txt", payload)
            with zipfile.ZipFile(archive) as input_archive:
                assert input_archive.read("payload.txt") == payload
            assert gzip.decompress(gzip.compress(payload)) == payload
            '
            wasmtime --dir .::/ --env PYTHONHOME=/ python.wasm -c '
            from datetime import datetime, timedelta
            from zoneinfo import ZoneInfo
            from packaging.version import Version
            from dateutil.parser import isoparse
            import six
            assert ZoneInfo("Europe/Madrid").utcoffset(datetime(2026, 7, 1)) == timedelta(hours=2)
            assert Version("2.0rc1") < Version("2.0")
            assert isoparse("2026-08-09T12:34:56+02:00").utcoffset() == timedelta(hours=2)
            assert six.text_type("ok") == "ok"
            '
            wasmtime --dir .::/ --env PYTHONHOME=/ python.wasm -c '
            import sqlite3
            database = sqlite3.connect("/sqlite-test.db")
            database.execute("CREATE TABLE values_table(value INTEGER)")
            database.execute("INSERT INTO values_table VALUES(42)")
            database.commit()
            database.close()
            '
            wasmtime --dir .::/ --env PYTHONHOME=/ python.wasm -c '
            import sqlite3
            database = sqlite3.connect("/sqlite-test.db")
            assert database.execute("SELECT value FROM values_table").fetchone() == (42,)
            database.close()
            '
            rm sqlite-test.db

    release:
      needs: [test, get-wasi-sdk-version]
      name: "Create draft release"
      runs-on: ubuntu-slim
      permissions:
        contents: write
        id-token: write
        attestations: write
      environment:
        name: release
        url: https://github.com/${{ github.repository }}/releases/tag/v${{ inputs.python_major_minor }}.${{ inputs.python_micro }}
      steps:
        - name: "Download executable zip"
          uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
          with:
            name: python
        - name: "Download build artifact zip"
          uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
          with:
            name: build
        - name: "Calculate zip file names"
          run: |
            export ZIP_FILE_NAME=python-${INPUTS_PYTHON_MAJOR_MINOR}.${INPUTS_PYTHON_MICRO}-wasi_sdk-${NEEDS_GET_WASI_SDK_VERSION_OUTPUTS_WASI_SDK_VERSION}.zip
            echo "EXECUTABLE_FILE_NAME=$ZIP_FILE_NAME" >> $GITHUB_ENV
            echo "BUILD_ARTIFACTS_FILE_NAME=_build-$ZIP_FILE_NAME" >> $GITHUB_ENV
          env:
            INPUTS_PYTHON_MAJOR_MINOR: ${{ inputs.python_major_minor }}
            INPUTS_PYTHON_MICRO: ${{ inputs.python_micro }}
            NEEDS_GET_WASI_SDK_VERSION_OUTPUTS_WASI_SDK_VERSION: ${{ needs.get-wasi-sdk-version.outputs.wasi_sdk_version }}
        - name: "Rename zip files"
          run: |
            mv python.zip ${EXECUTABLE_FILE_NAME}
            mv build.zip ${BUILD_ARTIFACTS_FILE_NAME}
        - name: "Attest artifacts"
          uses: actions/attest@59d89421af93a897026c735860bf21b6eb4f7b26 # v4.1.0
          with:
            subject-path: |
              ${{ env.EXECUTABLE_FILE_NAME }}
              ${{ env.BUILD_ARTIFACTS_FILE_NAME }}
            predicate-type: 'https://in-toto.io/attestation/release/v0.1'
            predicate: '{}'
        - name: "Create draft release"
          run: |
            gh release create v${INPUTS_PYTHON_MAJOR_MINOR}.${INPUTS_PYTHON_MICRO} \
              --title "CPython ${INPUTS_PYTHON_MAJOR_MINOR}.${INPUTS_PYTHON_MICRO} w/ WASI SDK ${NEEDS_GET_WASI_SDK_VERSION_OUTPUTS_WASI_SDK_VERSION}" \
              --repo "${{ github.repository }}" \
              --draft \
              ${EXECUTABLE_FILE_NAME} ${BUILD_ARTIFACTS_FILE_NAME}
          env:
            GH_TOKEN: ${{ github.token }}
            INPUTS_PYTHON_MAJOR_MINOR: ${{ inputs.python_major_minor }}
            INPUTS_PYTHON_MICRO: ${{ inputs.python_micro }}
            NEEDS_GET_WASI_SDK_VERSION_OUTPUTS_WASI_SDK_VERSION: ${{ needs.get-wasi-sdk-version.outputs.wasi_sdk_version }}
